<svg
    width="1200"
    height="350"
    viewBox="0 0 1200 350"
    xmlns="http://www.w3.org/2000/svg">

    <defs>

    <!-- Main Sky -->
    <linearGradient id="sky"
        x1="0%"
        y1="0%"
        x2="0%"
        y2="100%">

        <stop offset="0%" stop-color="#2E1F5E"/>

        <stop offset="25%" stop-color="#5543A5"/>

        <stop offset="55%" stop-color="#8E7CE8"/>

        <stop offset="80%" stop-color="#E2AAA8"/>

        <stop offset="100%" stop-color="#FFD2B5"/>

    </linearGradient>

    <!-- Sun -->

    <radialGradient id="sunGlow">

        <stop offset="0%" stop-color="#FFF9D9"/>

        <stop offset="15%" stop-color="#FFF1B3"/>

        <stop offset="45%" stop-color="#FFD9B2"/>

        <stop offset="100%" stop-color="transparent"/>

    </radialGradient>

    <!-- Horizon Glow -->

    <linearGradient id="horizon"

        x1="0%"
        y1="0%"
        x2="0%"
        y2="100%">

        <stop offset="0%" stop-color="#FFD7C2" stop-opacity="0"/>

        <stop offset="100%" stop-color="#FFD7C2"
              stop-opacity=".65"/>

    </linearGradient>

    <!-- Bloom Blur -->

    <filter id="bloom">

        <feGaussianBlur stdDeviation="40"/>

    </filter>

</defs>

    <!-- Background -->

    <rect
        width="1200"
        height="350"
        fill="url(#sky)" />

    <!-- Sun Bloom -->
<!-- Sky -->

<rect
    width="1200"
    height="350"
    fill="url(#sky)" />

<!-- Horizon -->

<rect

    x="0"

    y="210"

    width="1200"

    height="140"

    fill="url(#horizon)"/>

<!-- Sun -->

<circle

    cx="920"

    cy="70"

    r="90"

    fill="#FFF3C4"

    opacity=".75"/>

<!-- Bloom -->

<circle

    cx="920"

    cy="70"

    r="180"

    fill="url(#sunGlow)"

    filter="url(#bloom)"

    opacity=".85"/>

</svg>
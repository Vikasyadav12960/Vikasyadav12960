<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#2c1b59"/>
<stop offset="35%" stop-color="#5e58b7"/>
<stop offset="70%" stop-color="#d8a2b2"/>
<stop offset="100%" stop-color="#ffd6b5"/>
</linearGradient>
<radialGradient id="sun">
<stop offset="0%" stop-color="#fff8d7"/>
<stop offset="100%" stop-color="#fff8d7" stop-opacity="0"/>
</radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1200" height="350" fill="url(#sky)"/>
<circle cx="930" cy="75" r="120" fill="url(#sun)" filter="url(#blur)">
<animate attributeName="opacity" values=".9;.6;.9" dur="8s" repeatCount="indefinite"/>
</circle>
<g fill="#fff" opacity=".55">
<circle cx="140" cy="70" r="2"><animate attributeName="cy" values="70;64;70" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="360" cy="120" r="1.6"><animate attributeName="cy" values="120;114;120" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="780" cy="95" r="2"><animate attributeName="cy" values="95;88;95" dur="5s" repeatCount="indefinite"/></circle>
</g>
<g fill="#f8f8ff" opacity=".75">
<ellipse cx="180" cy="90" rx="70" ry="20"/>
<ellipse cx="240" cy="90" rx="60" ry="18"/>
<ellipse cx="210" cy="75" rx="45" ry="16"/>
<animateTransform attributeName="transform" type="translate" values="-20 0;20 0;-20 0" dur="80s" repeatCount="indefinite"/>
</g>
<g fill="#f8f8ff" opacity=".6">
<ellipse cx="760" cy="135" rx="80" ry="22"/>
<ellipse cx="830" cy="135" rx="58" ry="18"/>
<animateTransform attributeName="transform" type="translate" values="25 0;-25 0;25 0" dur="95s" repeatCount="indefinite"/>
</g>
<text x="80" y="210" font-size="48" font-family="JetBrains Mono, monospace" fill="white" font-weight="700">VIKAS YADAV</text>
<text x="82" y="245" font-size="18" font-family="JetBrains Mono, monospace" fill="#eef3ff">AI • Linux • Open Source • Automation</text>
<text x="82" y="282" font-size="18" font-family="JetBrains Mono, monospace" fill="#fff7ef">$ git commit -m "keep learning"</text>
<rect x="325" y="268" width="3" height="18" fill="#fff">
<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>
</svg>